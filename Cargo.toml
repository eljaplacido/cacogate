[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
cacogate-contracts = { path = "crates/cacogate-contracts" }
cacogate-kernel = { path = "crates/cacogate-kernel" }
cacogate-harness = { path = "crates/cacogate-harness" }
cacogate-ledger = { path = "crates/cacogate-ledger" }
cacogate-daemon = { path = "crates/cacogate-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ryu-js = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
toml = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
ureq = { version = "2", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
tempfile = "3"
jsonschema = { version = "0.30", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
float_cmp = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
match_same_arms = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
